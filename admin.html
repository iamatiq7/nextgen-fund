<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — NextGen Fund</title>
<meta name="description" content="NextGen Fund admin panel: registrations, members, payment verification, finance manager, settings and exports.">
<link rel="icon" href="assets/img/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="site-header"></div>

<main class="container" id="admin-main">
  <div class="spread" style="margin-bottom:12px">
    <div>
      <span class="k" data-i18n="adm.kicker"></span>
      <h1 style="margin:4px 0 2px" data-i18n="adm.title"></h1>
      <p class="footnote" style="margin:0" data-i18n="adm.sub"></p>
    </div>
    <div id="mode-badge" class="row-flex"></div>
  </div>

  <div id="admin-content" class="hide">
    <div class="tabs" role="tablist" id="admin-tabs">
      <button role="tab" data-tab="overview" aria-selected="true" data-i18n="adm.tabOverview"></button>
      <button role="tab" data-tab="registrations"><span data-i18n="adm.tabRegs"></span> <span id="tab-reg-n"></span></button>
      <button role="tab" data-tab="payments"><span data-i18n="adm.tabPays"></span> <span id="tab-pay-n"></span></button>
      <button role="tab" data-tab="members" data-i18n="adm.tabMembers"></button>
      <button role="tab" data-tab="finance" data-i18n="adm.tabFinance"></button>
      <button role="tab" data-tab="settings" data-i18n="adm.tabSettings"></button>
      <button role="tab" data-tab="export" data-i18n="adm.tabExport"></button>
      <button role="tab" data-tab="audit" data-i18n="adm.tabAudit"></button>
    </div>

    <section id="tab-body" aria-live="polite"></section>
  </div>
</main>

<footer id="site-footer" class="site-footer"></footer>

<script src="assets/js/util.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/seed-data.js"></script>
<script src="assets/js/firebase-config.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/firebase-adapter.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/admin.js"></script>
</body>
</html>
