name: Remove test residue (owner-run, guarded)

# One-shot cleanup for the test accounts the verification harness created while checking the
# registration flow in live mode (`docs.kept.*@ngf.local`, `drive.test*@ngf.local`).
# It only ever touches addresses matching those exact patterns - nothing else is read or deleted.
#
# Start it by changing ops/test-cleanup/TRIGGER's first line to:  cleanup 2026-09-15
# Delete this file and the TRIGGER afterwards: the removal push matches no path filter.

on:
  push:
    branches: [ main ]
    paths:
      - 'ops/test-cleanup/TRIGGER'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: test-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Guard
        id: guard
        run: |
          set -euo pipefail
          OK="no"
          if [ -f ops/test-cleanup/TRIGGER ]; then
            FIRST="$(head -n 1 ops/test-cleanup/TRIGGER | tr -d '\r' | sed 's/[[:space:]]*$//')"
            echo "trigger: [$FIRST]"
            if [ "$FIRST" = "cleanup 2026-09-15" ]; then OK="yes"; fi
          fi
          echo "OK=$OK" >> "$GITHUB_ENV"

      - name: Install the Admin SDK
        if: env.OK == 'yes'
        run: npm install --no-save --loglevel=error firebase-admin@13

      - name: Delete only the test accounts and their records
        if: env.OK == 'yes'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/.ci/sa.json
        run: |
          set -euo pipefail
          mkdir -p .ci
          printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT_NEXTGEN_FUND_2040 }}' > .ci/sa.json
          cat > cleanup.mjs <<'JS'
          import { initializeApp, applicationDefault } from 'firebase-admin/app';
          import { getAuth } from 'firebase-admin/auth';
          import { getFirestore } from 'firebase-admin/firestore';
          import fs from 'node:fs';
          const app = initializeApp({ credential: applicationDefault(), projectId: 'nextgen-fund-2040' });
          const auth = getAuth(app); const db = getFirestore(app);
          const PATTERNS = [/^docs\.kept\..*@ngf\.local$/i, /^drive\.test.*@ngf\.local$/i];
          const out = [];
          const listed = await auth.listUsers(1000);
          const doomed = listed.users.filter((u) => PATTERNS.some((re) => re.test(u.email || '')));
          out.push('auth accounts considered: ' + listed.users.length);
          out.push('test accounts matched   : ' + doomed.length + (doomed.length ? ' (' + doomed.map((u) => u.email).join(', ') + ')' : ''));
          if (doomed.length) { await auth.deleteUsers(doomed.map((u) => u.uid)); out.push('deleted                 : ' + doomed.length); }
          const regs = await db.collection('registrations').get();
          const bad = regs.docs.filter((d) => { const r = d.data() || {}; return PATTERNS.some((re) => re.test(String(r.email || ''))); });
          for (const d of bad) await d.ref.delete();
          out.push('registration rows removed: ' + bad.length);
          const after = await auth.listUsers(1000);
          out.push('auth accounts remaining : ' + after.users.length);
          out.push('result: PASS');
          fs.writeFileSync('ops/test-cleanup/REPORT.txt', out.join('\n') + '\n');
          console.log(out.join('\n'));
          JS
          node cleanup.mjs
          rm -rf .ci cleanup.mjs

      - name: Commit the report
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f ops/test-cleanup/REPORT.txt ]; then echo "no report"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ops/test-cleanup/REPORT.txt
          git diff --cached --quiet || git commit -m "chore(cleanup): test-residue report"
          git push
