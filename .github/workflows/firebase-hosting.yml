# Deploy the static site to Firebase Hosting on every push to main.
# One-time setup (by the site owner):
#   Firebase console -> Project settings -> Service accounts -> Generate new private key
#   GitHub repo -> Settings -> Secrets and variables -> Actions -> New repository secret
#   Name: FIREBASE_SERVICE_ACCOUNT_NEXTGEN_FUND_2040
#   Value: paste the whole JSON key file
# The key stays ONLY in GitHub Secrets - it is never committed to the repo.
name: Deploy to Firebase Hosting

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NEXTGEN_FUND_2040 }}
          channelId: live
          projectId: nextgen-fund-2040
