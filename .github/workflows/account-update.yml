name: Apply an account update (one stage at a time)

# One-shot maintenance job.
# Why: the published Firestore rules let a member read their own record but not update it, so the
# account screen cannot save these changes. This job applies one announced stage with the service
# account and records every field (before -> after).
#
# Guard: the first line of ops/account-update/TRIGGER must be exactly
#   run <stage> 2026-09-17      where <stage> is rocky | ronin
# Nothing runs otherwise. Every address is masked in the report.

on:
  push:
    branches: [ main ]
    paths: [ 'ops/account-update/TRIGGER', '.github/workflows/account-update.yml' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: write the service account key
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NEXTGEN_FUND_2040 }}
        run: |
          set -e
          printf '%s' "$SA" > sa.json
          node -e "JSON.parse(require('fs').readFileSync('sa.json','utf8')); console.log('service account key parsed')"

      - name: install the admin sdk
        run: npm i --no-save firebase-admin@12

      - name: read the announced stage
        id: stage
        run: |
          set -e
          line="$(head -n 1 ops/account-update/TRIGGER)"
          echo "line=$line"
          echo "$line" | grep -Eq '^run (rocky|ronin) 2026-09-17$' || { echo "armed=no" >> "$GITHUB_OUTPUT"; exit 0; }
          echo "armed=yes" >> "$GITHUB_OUTPUT"
          echo "stage=$(echo "$line" | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: dry run first
        if: steps.stage.outputs.armed == 'yes'
        env:
          DRY_RUN: 'true'
          STAGE: ${{ steps.stage.outputs.stage }}
        run: node ops/account-update/apply.mjs

      - name: apply
        if: steps.stage.outputs.armed == 'yes'
        env:
          DRY_RUN: 'false'
          STAGE: ${{ steps.stage.outputs.stage }}
        run: node ops/account-update/apply.mjs

      - name: publish the report
        if: always()
        run: |
          git config user.name 'github-actions'
          git config user.email 'github-actions@users.noreply.github.com'
          git add -f ops/account-update/REPORT-*.txt || true
          git commit -m 'chore(account-update): report' || true
          git push || true

      - name: remove the key
        if: always()
        run: rm -f sa.json
