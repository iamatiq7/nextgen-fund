name: Retention policy for replaced login addresses

# Runs nightly (00:30 Asia/Dhaka = 18:30 UTC) and on demand.
#   * warns the admin about replaced addresses that expire inside the warning window
#   * applies the configured behaviour (anonymize | disable | delete) once the window has passed
#   * records the run in settings/public.jobRuns, which the admin console shows
# The policy and the arithmetic come from assets/js/ngf-retention.js — the same module the admin
# policy screen and the automated checks use.
#
# Guard: the first line of ops/retention/TRIGGER must be exactly
#   run 2026-09-20
# Nothing runs otherwise, so an accidental push cannot change data.
#
# Forced pause: set settings/public.jobControl.paused = true from the admin console (Job dashboard);
# the job then records a paused run and changes nothing.

on:
  push:
    branches: [ main ]
    paths: [ 'ops/retention/TRIGGER', '.github/workflows/retention.yml' ]
  workflow_dispatch:
  schedule:
    - cron: '30 18 * * *'

permissions:
  contents: write

jobs:
  retention:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: write the service account key
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NEXTGEN_FUND_2040 }}
        run: |
          set -e
          printf '%s' "$SA" > sa.json
          node -e "JSON.parse(require('fs').readFileSync('sa.json','utf8')); console.log('service account key parsed')"

      - name: install the admin sdk
        run: npm i --no-save --loglevel=error firebase-admin@12

      - name: check the guard
        id: guard
        run: |
          set -e
          head -n 1 ops/retention/TRIGGER | grep -qx 'run 2026-09-20b' && echo "armed=yes" >> "$GITHUB_OUTPUT" || echo "armed=no" >> "$GITHUB_OUTPUT"

      - name: dry run first (nothing is written)
        if: steps.guard.outputs.armed == 'yes'
        env:
          DRY_RUN: 'true'
        run: |
          set +e
          node ops/retention/run.mjs 2>&1 | tee ops/retention/DRYRUN.txt
          echo "dry exit=$?"
          exit 0

      - name: apply the policy
        if: steps.guard.outputs.armed == 'yes'
        env:
          DRY_RUN: 'false'
        run: |
          set +e
          node ops/retention/run.mjs 2>&1 | tee ops/retention/RUN.txt
          echo "run exit=$?"
          exit 0

      - name: publish the report
        if: always()
        run: |
          rm -f sa.json
          git config user.name 'github-actions'
          git config user.email 'github-actions@users.noreply.github.com'
          git add -f ops/retention/REPORT.txt ops/retention/DRYRUN.txt ops/retention/RUN.txt || true
          git commit -m 'chore(retention): report' || true
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main >/dev/null 2>&1 || true
            git push && break
            sleep 5
          done
