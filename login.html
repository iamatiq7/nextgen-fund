<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login — NextGen Fund</title>
<meta name="description" content="Log in to your NextGen Fund member portal or the admin panel.">
<link rel="icon" href="assets/img/favicon.png" type="image/png">
<meta property="og:title" content="Login — NextGen Fund">
  <meta property="og:url" content="https://nextgenfund.web.app/login.html">
<meta property="og:description" content="Log in to your NextGen Fund member portal to see your balance, dues and payment history.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="NextGen Fund">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="assets/css/style.css">
  <link rel="canonical" href="https://nextgenfund.web.app/login.html">
</head>
<body>
<header class="site-header" id="site-header"></header>

<main class="container narrow">
  <span class="k" data-i18n="log.kicker"></span>
  <h1 data-i18n="log.title"></h1>
  <p class="footnote" data-i18n="log.sub"></p>

  <div class="card" style="margin-top:14px">
    <form id="login-form" novalidate>
      <label class="f"><span data-i18n="log.user"></span>
        <input type="text" id="li-user" name="identifier" autocomplete="username" placeholder="e.g. kazi.ibrahim" data-i18n-ph="ph.username" required>
      </label>
      <label class="f"><span data-i18n="log.pass"></span>
        <input type="password" id="li-pass" name="password" autocomplete="current-password" placeholder="Your password" data-i18n-ph="ph.password" required>
      </label>
      <div id="login-err" class="err" role="alert"></div>
      <button class="btn" type="submit" id="login-btn" data-i18n="log.btn"></button>
      <a class="btn subtle" href="register.html" style="margin-left:6px" data-i18n="log.new"></a>
      <p class="foot" style="margin:10px 0 0"><a href="#" id="pw-link" data-i18n="log.forgot"></a></p>
    </form>
  </div>

  <div class="card hide" id="pw-card" style="margin-top:12px">
    <h3 id="pw-title" data-i18n="log.resetTitle"></h3>
    <p class="footnote" data-i18n="log.resetHint"></p>
    <label class="f"><span data-i18n="log.resetId"></span>
      <input type="text" id="pw-id" autocomplete="off" placeholder="you@example.com / kazi.ibrahim / 01712345678" data-i18n-ph="ph.resetId">
    </label>
    <div id="pw-err" class="err" role="alert"></div>
    <div id="pw-done" class="notice ok hide"></div>
    <button class="btn" type="button" id="pw-send" data-i18n="log.resetSend"></button>
    <button class="btn subtle" type="button" id="pw-cancel" style="margin-left:6px" data-i18n="log.resetCancel"></button>
  </div>

  <div id="demo-note"></div>
</main>

<footer id="site-footer" class="site-footer"></footer>

<script src="assets/js/util.js?v=20260917c"></script>
<script src="assets/js/i18n.js?v=20260917c"></script>
<script src="assets/js/seed-data.js?v=20260917c"></script>
<script src="assets/js/firebase-config.js?v=20260917c"></script>
<script src="assets/js/store.js?v=20260917c"></script>
<script src="assets/js/firebase-adapter.js?v=20260917c"></script>
<script src="assets/js/common.js?v=20260917c"></script>
<script src="assets/js/login.js?v=20260917c"></script>
</body>
</html>
