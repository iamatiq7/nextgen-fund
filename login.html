<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login — NextGen Fund</title>
<meta name="description" content="Log in to your NextGen Fund member portal or the admin panel.">
<link rel="icon" href="assets/img/favicon.png" type="image/png">
<meta property="og:title" content="Login — NextGen Fund">
<meta property="og:description" content="Log in to your NextGen Fund member portal to see your balance, dues and payment history.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="NextGen Fund">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<header class="site-header" id="site-header"></header>

<main class="container narrow">
  <span class="k" data-i18n="log.kicker"></span>
  <h1 data-i18n="log.title"></h1>
  <p class="footnote" data-i18n="log.sub"></p>

  <div class="card" style="margin-top:14px">
    <form id="login-form" novalidate>
      <label class="f"><span data-i18n="log.user"></span>
        <input type="text" id="li-user" name="identifier" autocomplete="username" placeholder="e.g. kazi.ibrahim" data-i18n-ph="ph.username" required>
      </label>
      <label class="f"><span data-i18n="log.pass"></span>
        <input type="password" id="li-pass" name="password" autocomplete="current-password" placeholder="Your password" data-i18n-ph="ph.password" required>
      </label>
      <div id="login-err" class="err" role="alert"></div>
      <button class="btn" type="submit" id="login-btn" data-i18n="log.btn"></button>
      <a class="btn subtle" href="register.html" style="margin-left:6px" data-i18n="log.new"></a>
    </form>
  </div>

  <div id="demo-note"></div>
</main>

<footer id="site-footer" class="site-footer"></footer>

<script src="assets/js/util.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/seed-data.js"></script>
<script src="assets/js/firebase-config.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/firebase-adapter.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/login.js"></script>
</body>
</html>
